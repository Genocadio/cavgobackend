services:
  # PostgreSQL Database
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
    - cavgo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cavgo-redis
    ports:
      - "6379:6379"
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: cavgo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cavgo-network

  # Eureka Service Discovery
  eurekacavgo:
    build:
      context: ./Eurekacavgo
      dockerfile: Dockerfile
    container_name: cavgo-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Main Service (Java)
  cavgomain:
    build:
      context: ./cavgomain
      dockerfile: Dockerfile
    container_name: cavgo-main
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cavgomain
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      AGGREGATOR_BASE_URL: http://adminaggregate:4000
      NEXXAUTH_BASE_URL: ${NEXXAUTH_BASE_URL:-https://auth.med.rw/master}
      NEXXAUTH_ORGANISATION_ID: ${NEXXAUTH_ORGANISATION_ID:-1}
      NEXXAUTH_PUBLIC_KEY: ${NEXXAUTH_PUBLIC_KEY:-}
      NEXXAUTH_CLIENT_ID: ${NEXXAUTH_CLIENT_ID:-cli_vrwPaVOqk-EJHFft9o1Mq1g1W3h_KTCv6aNw6IlVit4}
      NEXXAUTH_CLIENT_TOKEN: ${NEXXAUTH_CLIENT_TOKEN:-nx_A-PoujyVQeOc-M9IWCPmRYtJ8QKIByUVZqHVm66By2M}
    ports:
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6060/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Gateway Service (Java)
  cavgogateway:
    build:
      context: ./Cavgogateway
      dockerfile: Dockerfile
    container_name: cavgo-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eurekacavgo:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Ridehail Service (Java)
  ridehail:
    build:
      context: ./ridehail
      dockerfile: Dockerfile
    container_name: cavgo-ridehail
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ridehail
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "6070:6070"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6070/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Meilisearch (search provider for locations, routes, trips)
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: cavgo-meilisearch
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-cavgoSearchMasterKey}
      MEILI_DB_PATH: /meili_data
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s
    networks:
      - cavgo-network

  # Trips Service (Go)
  cavgotrips:
    build:
      context: ./cavgotrips
      dockerfile: Dockerfile
    container_name: cavgo-trips
    environment:
      DATABASE_URL: host=postgres user=postgres password=postgres dbname=cavgotrips port=5432 sslmode=disable
      PORT: 6080
      EUREKA_SERVER_URL: http://eurekacavgo:8761
      EUREKA_APP_NAME: CAVGOTRIPS
      VEHICLE_SERVICE_URL: http://cavgomain:6060/main/vehicles/
      EUREKA_REGISTER: true
      EUREKA_PREFER_IP: true
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      RABBITMQ_QUEUE: trips.queue
      RABBITMQ_EXCHANGE: bookings.fanout
      STORE_LOGS: "true"
      TRIP_UPDATE_BASE_URL: http://adminaggregate:4000
      SEARCH_PROVIDER: auto
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-cavgoSearchMasterKey}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "6080:6080"
    depends_on:
      cavgomain:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Booking Service (Go)
  cavgobooking:
    build:
      context: ./cavgoBooking
      dockerfile: Dockerfile
    container_name: cavgo-booking
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cavgobooks?sslmode=disable
      SERVER_ADDRESS: :6030
      PORT: 6030
      ENVIRONMENT: docker
      TRIP_SERVICE_URL: http://cavgotrips:6080
      EUREKA_SERVER_URL: http://eurekacavgo:8761
      EUREKA_APP_NAME: cavgobooking
      EUREKA_REGISTER: true
      EUREKA_PREFER_IP: true
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      RABBITMQ_EXCHANGE: bookings.fanout
      BUNDLE_QUEUE_NAME: bookingbundles.queue
      BUNDLE_REPLY_QUEUE_NAME: bookingbundles.reply.queue
    ports:
      - "6030:6030"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      cavgotrips:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6030/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Ikuriye Backend Service (Java - Delivery/Packages)
  ikuriyebackend:
    build:
      context: ./ikuriyebackend
      dockerfile: Dockerfile
    container_name: cavgo-ikuriye
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ikuriye
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      SERVER_PORT: 6100
      NEXXAUTH_BASE_URL: ${NEXXAUTH_BASE_URL:-https://auth.med.rw/master}
      NEXXAUTH_ORGANISATION_ID: ${NEXXAUTH_ORGANISATION_ID:-1}
      NEXXAUTH_PUBLIC_KEY: ${NEXXAUTH_PUBLIC_KEY:-}
      NEXXAUTH_CLIENT_ID: ${NEXXAUTH_CLIENT_ID:-cli_vrwPaVOqk-EJHFft9o1Mq1g1W3h_KTCv6aNw6IlVit4}
      NEXXAUTH_CLIENT_TOKEN: ${NEXXAUTH_CLIENT_TOKEN:-nx_A-PoujyVQeOc-M9IWCPmRYtJ8QKIByUVZqHVm66By2M}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "6100:6100"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6100/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MQTT Service (Java)
  cavgomqt:
    build:
      context: ./cavgomqt
      dockerfile: Dockerfile
    container_name: cavgo-mqtt
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cavgomqt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GOOGLE_APPLICATION_CREDENTIALS: /opt/cavgo-data/firebase-credentials.json
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      NAVIGA_BASE_URL: http://navigation:6040
    ports:
      - "6090:6090"
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/opt/cavgo-data/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      navigation:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # USSD Service (Java)
  cavgoussd:
    build:
      context: ./ussdService
      dockerfile: Dockerfile
    container_name: cavgo-ussd
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TRIP_SERVICE_HOST: cavgotrips
      TRIP_SERVICE_PORT: 6080
      BACKEND_BASE_URL: http://cavgomain:6060
    ports:
      - "6050:6050"
    depends_on:
      eurekacavgo:
        condition: service_healthy
      cavgotrips:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6050/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  adminaggregate:
    build:
      context: ./adminaggregate
      dockerfile: Dockerfile
    container_name: cavgo-adminaggregate
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adminaggregate?sslmode=disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
      MAIN_BASE_URL: http://cavgomain:6060
      TRIPS_BASE_URL: http://cavgotrips:6080
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      cavgotrips:
        condition: service_healthy
    networks:
      - cavgo-network
  # Navigation Service (Java)
  navigation:
    build:
      context: ./Navigation
      dockerfile: Dockerfile
    container_name: cavgo-navigation
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/navigation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      OSRM_URL: http://host.docker.internal:5000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "6040:6040"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6040/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  meili_data:

networks:
  cavgo-network:
    driver: bridge
