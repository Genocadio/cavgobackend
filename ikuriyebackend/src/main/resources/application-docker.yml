spring:
  application:
    name: ikuriyebackend
  datasource:
    url: jdbc:postgresql://postgres:5432/ikuriye
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin

# MinIO is reachable by service name inside the Docker network. Credentials
# and the public (client-facing) endpoint come from the environment.
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}

eureka:
  client:
    service-url:
      defaultZone: http://eurekacavgo:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

server:
  port: 6100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
