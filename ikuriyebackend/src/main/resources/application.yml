spring:
  application:
    name: ikuriyebackend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ikuriye}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      pool-name: CavGoHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 4
    clean-disabled: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin}

  graphql:
    graphiql:
      enabled: true
    schema:
      locations: classpath:graphql/
    websocket:
      path: /graphql
      connection-init-timeout: 10s

# Nexxauth is the identity provider (auth + roles). The backend verifies org
# access tokens offline against the configured org public key, and uses the
# SERVER client to read/provision users and assign roles through the
# organisation API.
nexxauth:
  base-url: ${NEXXAUTH_BASE_URL:https://auth.med.rw/master}
  public-key: ${NEXXAUTH_PUBLIC_KEY:}
  client-id: ${NEXXAUTH_CLIENT_ID:}
  client-token: ${NEXXAUTH_CLIENT_TOKEN:}

# Cavgo Main — internal sync endpoint. When a WORKER or DRIVER authenticates
# through ikuriyebackend, a fire-and-forget request is sent to cavgomain to
// ensure it mirrors the same user. Optional: if not set, sync is skipped.
cavgomain:
  base-url: ${CAVGOMAIN_BASE_URL:}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

# Supabase Storage — file uploads (package media + profile avatars).
# The backend proxies uploads and generates signed URLs so clients never
# see Supabase URLs or bucket names.
supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}

# Backend base URL — prepended to local file URLs so clients get full
# absolute paths (e.g. https://api.med.rw/gocavgo/ikuriye/api/files/local/...).
backend:
  base-url: ${BACKEND_BASE_URL:https://api.med.rw/gocavgo/ikuriye}

# Local file storage — used when Supabase is not configured or unavailable.
# Files are stored under this path, served via /api/files/local/{bucket}/...
storage:
  local:
    base-path: ${LOCAL_STORAGE_PATH:./storage}
  migration:
    enabled: ${STORAGE_MIGRATION_ENABLED:true}

rabbitmq:
  naviga:
    exchange: cavgomqt.trip.updates
    queue: ikuriyebackend.naviga-trips

logging:
  level:
    org.springframework.graphql.server.webmvc.GraphQlWebSocketHandler: WARN

server:
  port: ${SERVER_PORT:6100}
  compression:
    # GraphQL list payloads (200 packages with nested data) are large JSON;
    # gzip cuts them ~80-90% and nginx passes Accept-Encoding through.
    enabled: true
    mime-types: application/json,application/graphql-response+json,text/plain,text/html,text/css,application/javascript
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
