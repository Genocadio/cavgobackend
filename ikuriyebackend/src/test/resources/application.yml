spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  graphql:
    graphiql:
      enabled: false

nexxauth:
  base-url: https://auth.test/master
  organisation-id: 7
  # Test-only RSA public key (base64 DER SPKI) — generated locally, used to
  # construct the verifier bean; never verify real tokens with it.
  public-key: 
  client-id: cli_test
  client-token: nx_test
