spring:
  application:
    name: cavgomqt
  integration:
    mqtt:
      default-qos: 1
      default-retained: false
      completion-timeout: 5000
  datasource:
    url: jdbc:postgresql://postgres:5432/cavgomqt
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin
mqtt:
  client:
    id: cavgomqt
  # Broker connection is injected by docker compose from environment secrets
  # (MQTT_BROKER_URL / MQTT_USERNAME / MQTT_PASSWORD — see .env.example at the
  # cavgobackend root). Empty username/password disable authentication; the URL
  # falls back to a local broker if the env vars are missing.
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
logging:
  level:
    org:
      springframework:
        integration:
          mqtt: INFO
      eclipse:
        paho:
          client:
            mqttv3: WARN
    com:
      nexxserve:
        cavgomqt: INFO

eureka:
  client:
    service-url:
      defaultZone: http://eurekacavgo:8761/eureka/
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}


app:
  heartbeat:
    interval: 30000
    timeout: 60000
  max-concurrent-trips: 2000
  max-cars: 3000
  max-bookings-per-trip: 60
firebase:
  topic:
    default: general
naviga:
  base:
    url: http://navigation:6040
server:
  port: 6090
vehicle:
  backend:
    url: http://cavgomain:6060