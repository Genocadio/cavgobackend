spring:
  application:
    name: cavgomqt
  datasource:
    url: jdbc:postgresql://localhost:5432/cavgomqt
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  web:
    resources:
      add-mappings: false

  jpa:
    hibernate:
      ddl-auto: update
  integration:
    mqtt:
      default-qos: 1
      default-retained: false
      completion-timeout: 5000
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

mqtt:
  client.id: cavgomqt
  # Broker connection is injected as environment secrets at deploy time
  # (MQTT_BROKER_URL / MQTT_USERNAME / MQTT_PASSWORD — see .env.example at the
  # cavgobackend root). Empty username/password disable authentication and the
  # URL falls back to a local broker so non-docker dev runs still boot.
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  broker.url: ${MQTT_BROKER_URL:tcp://localhost:1883}
logging:
  level:
    org:
      springframework:
        integration:
          mqtt: INFO
      eclipse:
        paho:
          client:
            mqttv3: WARN
    com:
      nexxserve:
        cavgomqt: INFO


app:
  heartbeat:
    interval: 30000
    timeout: 60000
  max-concurrent-trips: 2000
  max-cars: 3000
  max-bookings-per-trip: 60
firebase:
  topic:
    default: general
naviga:
  base:
    url: http://localhost:8080
server:
  port: 5090