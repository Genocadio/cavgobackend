services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - cavgo-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - cavgo-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cavgo-redis
    ports:
      - "6379:6379"
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cavgo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - /opt/cavgo-data/postgres:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cavgo-network
    restart: unless-stopped

  # OSRM Data Preparation (Run once manually)
  osrm-setup:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-setup
    volumes:
      - osrm_data:/data
      - ./osrm-setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    networks:
      - cavgo-network
    profiles:
      - setup

  # OSRM Routing Engine
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-rwanda
    command: osrm-routed --algorithm mld /data/rwanda-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data:ro
    networks:
      - cavgo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:5000/route/v1/driving/30.0619,-1.9536;30.1044,-1.9706' 2>&1 | grep -q '\"code\":\"Ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      - redis

  # Eureka Service Discovery
  eurekacavgo:
    image: genoyves/cavgo-system:eureka
    container_name: cavgo-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8761/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Main Service (Java)
  cavgomain:
    image: genoyves/cavgo-system:main
    container_name: cavgo-main
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cavgomain
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: admin
      AGGREGATOR_BASE_URL: http://adminaggregate:4000
    ports:
      - "6060:6060"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6060/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Gateway Service (Java)
  cavgogateway:
    image: genoyves/cavgo-system:gateway
    container_name: cavgo-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eurekacavgo:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Ridehail Service (Java)
  ridehail:
    image: genoyves/cavgo-system:ridehail
    container_name: cavgo-ridehail
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ridehail
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "6070:6070"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6070/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Trips Service (Go)
  cavgotrips:
    image: genoyves/cavgo-system:trips
    container_name: cavgo-trips
    environment:
      DATABASE_URL: host=postgres user=postgres password=postgres dbname=cavgotrips port=5432 sslmode=disable
      PORT: 6080
      EUREKA_SERVER_URL: http://eurekacavgo:8761
      EUREKA_APP_NAME: CAVGOTRIPS
      VEHICLE_SERVICE_URL: http://cavgomain:6060/main/vehicles/
      EUREKA_REGISTER: true
      EUREKA_PREFER_IP: true
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      RABBITMQ_QUEUE: tripservicesend
      RABBITMQ_EXCHANGE: bookings.fanout
      STORE_LOGS: "true"
      TRIP_UPDATE_BASE_URL: http://adminaggregate:4000
    ports:
      - "6080:6080"
    depends_on:
      cavgomain:
        condition: service_healthy
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6080/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Booking Service (Go)
  cavgobooking:
    image: genoyves/cavgo-system:booking
    container_name: cavgo-booking
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cavgobooks?sslmode=disable
      SERVER_ADDRESS: :6030
      PORT: 6030
      ENVIRONMENT: docker
      TRIP_SERVICE_URL: http://cavgotrips:6080
      EUREKA_SERVER_URL: http://eurekacavgo:8761
      EUREKA_APP_NAME: cavgobooking
      EUREKA_REGISTER: true
      EUREKA_PREFER_IP: true
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      RABBITMQ_EXCHANGE: bookings.fanout
      BUNDLE_QUEUE_NAME: bookingbundles.queue
      BUNDLE_REPLY_QUEUE_NAME: bookingbundles.reply.queue
    ports:
      - "6030:6030"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      cavgotrips:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6030/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cavgomqt:
    image: genoyves/cavgo-system:cavgomqt
    container_name: cavgo-maqtt
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cavgomqt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
      GOOGLE_APPLICATION_CREDENTIALS: /opt/cavgo-data/firebase-credentials.json
      NAVIGA_BASE_URL: http://navigation:6040
    ports:
      - "6090:6090"
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/opt/cavgo-data/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      navigation:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6090/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # USSD Service (Java)
  cavgoussd:
    image: genoyves/cavgo-system:ussd
    container_name: cavgo-ussd
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TRIP_SERVICE_HOST: cavgotrips
      TRIP_SERVICE_PORT: 6080
      BACKEND_BASE_URL: http://cavgomain:6060
    ports:
      - "6050:6050"
    depends_on:
      eurekacavgo:
        condition: service_healthy
      cavgotrips:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6050/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  adminaggregate:
    image: genoyves/cavgo-system:adminaggregate
    container_name: cavgo-adminaggregate
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adminaggregate?sslmode=disable
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
      MAIN_BASE_URL: http://cavgomain:6060
      TRIPS_BASE_URL: http://cavgotrips:6080
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      cavgomain:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      cavgotrips:
        condition: service_healthy
    networks:
      - cavgo-network
    restart: unless-stopped

  # Ikuriye Backend Service (Java - Delivery/Packages)
  ikuriyebackend:
    image: genoyves/cavgo-system:ikuriyebackend
    container_name: cavgo-ikuriye
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ikuriye
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
      SERVER_PORT: 6100
      NEXXAUTH_BASE_URL: ${NEXXAUTH_BASE_URL:https://auth.med.rw/master}
      NEXXAUTH_ORGANISATION_ID: ${NEXXAUTH_ORGANISATION_ID:1}
      NEXXAUTH_PUBLIC_KEY: ${NEXXAUTH_PUBLIC_KEY:}
      NEXXAUTH_CLIENT_ID: ${NEXXAUTH_CLIENT_ID:cli_vrwPaVOqk-EJHFft9o1Mq1g1W3h_KTCv6aNw6IlVit4}
      NEXXAUTH_CLIENT_TOKEN: ${NEXXAUTH_CLIENT_TOKEN:nx_PjNP5l_Iz7XjTKhJhMxFO6p6R19eS-rmYA762CKs_7U}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:*}
    ports:
      - "6100:6100"
    depends_on:
      postgres:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6100/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Navigation Service (Java)
  navigation:
    image: genoyves/cavgo-system:navigation
    container_name: cavgo-navigation
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/navigation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      OSRM_URL: http://osrm:5000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekacavgo:8761/eureka/
    ports:
      - "6040:6040"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eurekacavgo:
        condition: service_healthy
      osrm:
        condition: service_healthy
    networks:
      - cavgo-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:6040/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  portainer_data:
  osrm_data:

networks:
  cavgo-network:
    driver: bridge
