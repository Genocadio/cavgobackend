# CORS: comma-separated allowed origins, or "*" for all.
# Override via env: CORS_ALLOWED_ORIGINS=https://book.gocavgo.com,https://admin.gocavgo.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

spring:
  application:
    name: cavgogateway
  codec:
    max-in-memory-size: 100MB
  cloud:
    gateway:
      # Add request/response logging filter globally
      default-filters:
        - name: RequestResponse
          args:
            includeRequestBody: true
            includeResponseBody: false  # Disable for SSE to avoid issues
            includeHeaders: true
      # SSE specific configuration
      server:
        webflux:
          httpclient:
            connect-timeout: 10000  # 10 seconds for initial connection
            response-timeout: 300000  # 5 minutes for SSE responses
          routes:
            # SSE specific route - MUST come before general route
                    - id: cavgotrips-sse
                      uri: lb://cavgotrips
                      predicates:
                        - Path=/api/navig/events/**
                        - Header=Accept, text/event-stream
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST
                      metadata:
                        response-timeout: 300000  # 5 minutes for SSE
                        connect-timeout: 10000

                    # Alternative SSE route without Accept header requirement
                    - id: cavgotrips-sse-fallback
                      uri: lb://cavgotrips
                      predicates:
                        - Path=/api/navig/events/**
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST
                      metadata:
                        response-timeout: 300000
                        connect-timeout: 10000

                    - id: cavgomain
                      uri: lb://cavgomain
                      predicates:
                        - Path=/api/main/**
                      filters:
                        - StripPrefix=1
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    # General cavgotrips route - MUST come after SSE routes
                    - id: cavgotrips
                      uri: lb://cavgotrips
                      predicates:
                        - Path=/api/navig/**
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    - id: cavgobooking
                      uri: lb://cavgobooking
                      predicates:
                        - Path=/api/book/**
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    - id: ridehail
                      uri: lb://ridehail
                      predicates:
                        - Path=/api/ride/**
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    # REST API route for ikuriyebackend — matches requests arriving
                    # via nginx /gocavgo/ikuriye/api/** → gateway /ikuriye/api/**
                    - id: ikuriyebackend-api
                      uri: lb://ikuriyebackend
                      predicates:
                        - Path=/ikuriye/api/**
                      filters:
                        - StripPrefix=1
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    - id: ikuriyebackend
                      uri: lb://ikuriyebackend
                      predicates:
                        - Path=/api/ikuriye/**
                      filters:
                        - StripPrefix=2
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

                    # WebSocket route for ikuriyebackend subscriptions — MUST come before HTTP route
                    # so WebSocket upgrade requests are matched first and forwarded with ws:// scheme.
                    - id: ikuriyebackend-ws
                      uri: lb:ws://ikuriyebackend
                      predicates:
                        - Path=/ikuriye/graphql
                        - Header=Upgrade, websocket
                      filters:
                        - StripPrefix=1

                    # GraphQL HTTP route for ikuriyebackend (queries/mutations only)
                    - id: ikuriyebackend-graphql
                      uri: lb://ikuriyebackend
                      predicates:
                        - Path=/ikuriye/graphql
                      filters:
                        - StripPrefix=1
                        - name: DedupeResponseHeader
                          args:
                            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
                            strategy: RETAIN_FIRST

server:
  port: 8080
  # Add Netty specific configuration for SSE
  netty:
    connection-timeout: 10s
    idle-timeout: 300s

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eurekacavgo:8761/eureka/
  instance:
    prefer-ip-address: true
    # Increase lease renewal for SSE connections
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Enhanced Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.security: DEBUG
    com.nexxserve.gateway: DEBUG
    com.nexxserve.cavgogateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.http.server.reactive: DEBUG
    io.netty: DEBUG  # Add Netty logging for connection issues
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{spanId}] %logger{36} - %msg%n"
  file:
    name: logs/gateway.log

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,routes
  endpoint:
    health:
      show-details: always
    routes:
      enabled: true