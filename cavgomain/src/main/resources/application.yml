spring:
  application:
   name: cavgomain
  datasource:
    url: jdbc:postgresql://localhost:5432/cavgomain
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  web:
    resources:
      add-mappings: false

  jpa:
   hibernate:
     ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        auto-startup: false  # Don't auto-start listeners on app startup

# Nexxauth identity — tokens are issued by Nexxauth, verified offline here
nexxauth:
  public-key: ${NEXXAUTH_PUBLIC_KEY:}
  base-url: ${NEXXAUTH_BASE_URL:}
  organisation-id: ${NEXXAUTH_ORGANISATION_ID:}
  client-id: ${NEXXAUTH_CLIENT_ID:}
  client-token: ${NEXXAUTH_CLIENT_TOKEN:}

eureka:
 client:
  register-with-eureka: true
 instance:
  prefer-ip-address: true
  instance-id: ${spring.application.name}:${random.uuid}
server:
  port: 8060

aggregator:
  base-url: ${AGGREGATOR_BASE_URL:}
