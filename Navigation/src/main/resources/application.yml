spring:
  application:
    name: Navigation

  
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
  
  datasource:
    url: jdbc:postgresql://localhost:5432/navigation
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}

osrm:
  url: ${OSRM_URL:http://localhost:5001}
  timeout:
    seconds: 10

navigation:
  off-route:
    city:
      distance-threshold-meters: 25  # Reduced from 40m for faster rerouting response
      consecutive-updates: 1  # Reduced from 2 - reroute after 1 off-route detection in city
    non-city:
      distance-threshold-meters: 30  # Reduced from 40m for faster rerouting response
      consecutive-updates: 2  # Reduced from 3 - reroute after 2 consecutive off-route detections
  arrival:
    radius-meters: 20
    pass-threshold-meters: 10
  gps:
    min-speed-ms: 0.5
    max-age-seconds: 30
    min-accuracy-meters: 100
    validate-age: true  # Set to false to disable GPS age validation (too old check)
    map-matching:
      enabled: false  # Set to false to use raw GPS coordinates instead of snapping to route
      post-match: false # If true, returns snapped location in API but keeps raw GPS for internal state (if enabled is false)
  persistence:
    periodic-save-interval-seconds: 10  # Save navigation state every 10 seconds
    snapshot-retention-days: 30  # Keep snapshots for 30 days

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}

server:
  port: 6040

