name: CI - Build Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      eureka: ${{ steps.filter.outputs.eureka }}
      main: ${{ steps.filter.outputs.main }}
      gateway: ${{ steps.filter.outputs.gateway }}
      ridehail: ${{ steps.filter.outputs.ridehail }}
      trips: ${{ steps.filter.outputs.trips }}
      booking: ${{ steps.filter.outputs.booking }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      ussd: ${{ steps.filter.outputs.ussd }}
      navigation: ${{ steps.filter.outputs.navigation }}
      adminaggregate: ${{ steps.filter.outputs.adminaggregate }}
      ikuriye: ${{ steps.filter.outputs.ikuriye }}
      has_changes: ${{ steps.filter.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          any_changed=false

          detect() {
            local path=$1
            local name=$2
            if git diff --quiet HEAD^ HEAD -- "$path" 2>/dev/null; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name=true" >> "$GITHUB_OUTPUT"
              any_changed=true
            fi
          }

          detect "Eurekacavgo" "eureka"
          detect "cavgomain" "main"
          detect "Cavgogateway" "gateway"
          detect "ridehail" "ridehail"
          detect "cavgotrips" "trips"
          detect "cavgoBooking" "booking"
          detect "cavgomqt" "mqtt"
          detect "ussdService" "ussd"
          detect "Navigation" "navigation"
          detect "adminaggregate" "adminaggregate"
          detect "ikuriyebackend" "ikuriye"

          echo "has_changes=$any_changed" >> "$GITHUB_OUTPUT"

  # ── Java services (Spring Boot) ──────────────────────────────────────
  build-eureka:
    name: Validate Eureka
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.eureka == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Eureka
        working-directory: ./Eurekacavgo
        run: ./gradlew build -x test --no-daemon

  build-main:
    name: Validate cavgomain
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.main == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build cavgomain
        working-directory: ./cavgomain
        run: ./gradlew build -x test --no-daemon

  build-gateway:
    name: Validate gateway
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.gateway == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build gateway
        working-directory: ./Cavgogateway
        run: ./gradlew build -x test --no-daemon

  build-ridehail:
    name: Validate ridehail
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ridehail == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build ridehail
        working-directory: ./ridehail
        run: ./gradlew build -x test --no-daemon

  build-mqtt:
    name: Validate cavgomqt
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mqtt == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build cavgomqt
        working-directory: ./cavgomqt
        run: ./gradlew build -x test --no-daemon

  build-ussd:
    name: Validate ussd
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ussd == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build ussd
        working-directory: ./ussdService
        run: ./gradlew build -x test --no-daemon

  build-navigation:
    name: Validate navigation
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.navigation == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build navigation
        working-directory: ./Navigation
        run: ./gradlew build -x test --no-daemon

  build-ikuriye:
    name: Validate ikuriyebackend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ikuriye == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build ikuriyebackend
        working-directory: ./ikuriyebackend
        run: ./gradlew build -x test --no-daemon

  # ── Go services ──────────────────────────────────────────────────────
  build-trips:
    name: Validate cavgotrips
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.trips == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cavgotrips/go.sum
      - name: Build cavgotrips
        working-directory: ./cavgotrips
        run: go build -o /dev/null ./...

  build-booking:
    name: Validate cavgobooking
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.booking == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cavgoBooking/go.sum
      - name: Build cavgobooking
        working-directory: ./cavgoBooking
        run: go build -o /dev/null ./...

  # ── Node.js services ─────────────────────────────────────────────────
  build-adminaggregate:
    name: Validate adminaggregate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.adminaggregate == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: adminaggregate/package-lock.json
      - name: Install dependencies
        working-directory: ./adminaggregate
        run: npm ci
      - name: Build
        working-directory: ./adminaggregate
        run: npm run build

  # ── Docker build validation ──────────────────────────────────────────
  docker-build-validation:
    name: Docker build (${{ matrix.service }})
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_changes == 'true' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka
            context: ./Eurekacavgo
          - service: main
            context: ./cavgomain
          - service: gateway
            context: ./Cavgogateway
          - service: ridehail
            context: ./ridehail
          - service: trips
            context: ./cavgotrips
          - service: booking
            context: ./cavgoBooking
          - service: mqtt
            context: ./cavgomqt
          - service: ussd
            context: ./ussdService
          - service: navigation
            context: ./Navigation
          - service: adminaggregate
            context: ./adminaggregate
          - service: ikuriyebackend
            context: ./ikuriyebackend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: cavgo-ci/${{ matrix.service }}:validate
          cache-from: type=gha,scope=ci-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.service }}
