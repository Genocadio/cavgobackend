name: Build and Push Ikuriye Backend

on:
  workflow_run:
    workflows: [CI - Build Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      ikuriye: ${{ steps.filter.outputs.ikuriye }}
    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ikuriye=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD^ HEAD -- "ikuriyebackend" 2>/dev/null; then
            echo "ikuriye=false" >> "$GITHUB_OUTPUT"
          else
            echo "ikuriye=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and push ikuriyebackend image
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.ikuriye == 'true' }}

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ikuriyebackend
        uses: docker/build-push-action@v5
        with:
          context: ./ikuriyebackend
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:ikuriyebackend
          cache-from: type=gha,scope=ikuriyebackend
          cache-to: type=gha,mode=max,scope=ikuriyebackend
