        uses: docker/build-push-action@v5
        with:
          context: ./cavgoBooking
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:booking
          cache-from: type=gha,scope=booking
          cache-to: type=gha,mode=max,scope=booking

      - name: Build and push mqtt
        if: ${{ needs.detect-changes.outputs.mqtt == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: ./cavgomqt
