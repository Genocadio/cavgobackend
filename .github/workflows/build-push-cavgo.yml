          cache-to: type=gha,mode=max,scope=mqtt

      - name: Build and push ussd
        if: ${{ needs.detect-changes.outputs.ussd == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
