name: Build and Push All CavGo Services

on:
  workflow_run:
    workflows: [CI - Build Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    outputs:
      eureka: ${{ steps.filter.outputs.eureka }}
      main: ${{ steps.filter.outputs.main }}
      gateway: ${{ steps.filter.outputs.gateway }}
      ridehail: ${{ steps.filter.outputs.ridehail }}
      trips: ${{ steps.filter.outputs.trips }}
      booking: ${{ steps.filter.outputs.booking }}
      mqtt: ${{ steps.filter.outputs.mqtt }}
      ussd: ${{ steps.filter.outputs.ussd }}
      navigation: ${{ steps.filter.outputs.navigation }}
      adminaggregate: ${{ steps.filter.outputs.adminaggregate }}
      ikuriye: ${{ steps.filter.outputs.ikuriye }}
      postgres: ${{ steps.filter.outputs.postgres }}

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          detect() {
            local path=$1
            local name=$2
            if git diff --quiet HEAD^ HEAD -- "$path" 2>/dev/null; then
              echo "$name=false" >> "$GITHUB_OUTPUT"
            else
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          }

          detect "Eurekacavgo" "eureka"
          detect "cavgomain" "main"
          detect "Cavgogateway" "gateway"
          detect "ridehail" "ridehail"
          detect "cavgotrips" "trips"
          detect "cavgoBooking" "booking"
          detect "cavgomqt" "mqtt"
          detect "ussdService" "ussd"
          detect "Navigation" "navigation"
          detect "adminaggregate" "adminaggregate"
          detect "ikuriyebackend" "ikuriye"
          detect "init-multiple-dbs.sh" "postgres"

  build-and-push:
    name: Build and push changed images
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push postgres
        if: ${{ needs.detect-changes.outputs.postgres == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.postgres
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:postgres
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Build and push eureka
        if: ${{ needs.detect-changes.outputs.eureka == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: ./Eurekacavgo
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:eureka
          cache-from: type=gha,scope=eureka
          cache-to: type=gha,mode=max,scope=eureka

      - name: Build and push main
        if: ${{ needs.detect-changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: ./cavgomain
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:main
          cache-from: type=gha,scope=main
          cache-to: type=gha,mode=max,scope=main

      - name: Build and push gateway
        if: ${{ needs.detect-changes.outputs.gateway == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: ./Cavgogateway
          platforms: linux/amd64
          push: true
          tags: genoyves/cavgo-system:gateway
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Build and push ridehail
        if: ${{ needs.detect-changes.outputs.ridehail == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
