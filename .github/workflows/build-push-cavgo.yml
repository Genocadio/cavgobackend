          cache-to: type=gha,mode=max,scope=ridehail

      - name: Build and push trips
        if: ${{ needs.detect-changes.outputs.trips == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: ./cavgotrips
